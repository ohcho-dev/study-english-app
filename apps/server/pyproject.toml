[tool.poetry]
name = "study-english-server"
version = "0.1.0"
description = "AI English Learning Service Backend"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic-settings = "^2.1.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
greenlet = "^3.0.0"
psycopg = {extras = ["binary", "pool"], version = "^3.1.0"}
alembic = "^1.13.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
authlib = "^1.3.0"
httpx = ">=0.28.1"
redis = "^5.0.1"
langchain = "^1.2.10"
langchain-google-genai = "^4.2.0"
langgraph = "^1.0.8"
python-multipart = "^0.0.6"
tenacity = "^8.2.3"
structlog = "^24.1.0"
asyncpg = "^0.31.0"
google-genai = "^1.62.0"
google-cloud-storage = "^2.18.0"
google-generativeai = "^0.8.3"
pillow = "^12.1.0"
pydub = "^0.25.1"
google-cloud-speech = "^2.36.1"
google-cloud-texttospeech = "^2.34.0"
google-cloud-translate = "^3.18.0"
audioop-lts = {version = ">=0.2.1", markers = "python_version >= \"3.13\""}
aiortc = "^1.14.0"
pandas = "^3.0.0"
openpyxl = "^3.1.5"
jiwer = "^4.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.14"
mypy = "^1.8.0"
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
